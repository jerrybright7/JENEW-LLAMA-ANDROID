name: JENEW llama.cpp ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp

      - name: Install Android NDK
        run: |
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          echo "ANDROID_NDK=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Compile ARM64 shared libraries
        run: |
          cd llama.cpp

          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF

          cmake --build build-android --config Release --parallel 2

          mkdir -p output
          shopt -s nullglob
          libs=(build-android/bin/*.so)
          if (( ${#libs[@]} == 0 )); then
            echo "ERROR: No shared libraries were produced in build-android/bin"
            exit 1
          fi
          cp "${libs[@]}" output/
          cp LICENSE output/

          echo "Built Android ARM64 libraries:"
          ls -lh output/

          cd output
          zip -9 -j ../JENEW-LLAMA-ARM64.zip ./*

      - name: Upload ARM64 libraries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JENEW-LLAMA-ARM64
          path: |
            llama.cpp/output/
            llama.cpp/JENEW-LLAMA-ARM64.zip
          if-no-files-found: error

      - name: Publish downloadable ARM64 package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-android-arm64
          name: JENEW llama.cpp Android ARM64
          body: |
            Prebuilt llama.cpp shared libraries for Android arm64-v8a.
            Minimum Android API: 28.
            Includes libllama.so and its ggml shared-library dependencies.
          files: llama.cpp/JENEW-LLAMA-ARM64.zip
          overwrite_files: true
          make_latest: false
