name: JENEW llama.cpp ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp

      - name: Install Android NDK
        run: |
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          echo "ANDROID_NDK=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compile ARM64
        run: |
          cd llama.cpp

          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build build-android --config Release --parallel 2

          mkdir -p output
          find build-android -name '*.so' -exec cp {} output/ \;
          cp LICENSE output/

      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: JENEW-LLAMA-ARM64
          path: llama.cpp/output/
          if-no-files-found: error
