name: zrok live multi-service verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-zrok-multi-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZROK_LIVE_TEST: "1"
      ZROK_LIVE_API_ENDPOINT: ${{ secrets.ZROK_LIVE_API_ENDPOINT }}
      ZROK_LIVE_ACCOUNT_TOKEN: ${{ secrets.ZROK_LIVE_ACCOUNT_TOKEN }}
      ZROK_LIVE_HOST: ${{ secrets.ZROK_LIVE_HOST }}
    steps:
      - name: Checkout prototype source branch
        uses: actions/checkout@v4
        with:
          ref: zrok-gomobile-prototype
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: zrok-mobile/go.mod
          cache-dependency-path: zrok-mobile/go.sum
      - name: Verify required secrets are configured
        shell: bash
        run: |
          test -n "$ZROK_LIVE_API_ENDPOINT" || { echo "Missing repository secret ZROK_LIVE_API_ENDPOINT"; exit 1; }
          test -n "$ZROK_LIVE_ACCOUNT_TOKEN" || { echo "Missing repository secret ZROK_LIVE_ACCOUNT_TOKEN"; exit 1; }
          test -n "$ZROK_LIVE_HOST" || { echo "Missing repository secret ZROK_LIVE_HOST"; exit 1; }
      - name: Run authenticated live multi-service test
        working-directory: zrok-mobile
        run: go test -v -count=1 ./bridge -run '^TestLiveZrokMultiServiceRoundTrip$'
