name: JENEW ESP32 Simulator ARM64 Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download official ESP32Sim 0.4.0 releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/arm64 dist/host roms
          BASE="https://github.com/mikroverk/esp32sim/releases/download/v0.4.0"
          curl -fL --retry 3 "$BASE/esp32sim-0.4.0-linux-arm64.tar.gz" -o esp32sim-0.4.0-linux-arm64.tar.gz
          curl -fL --retry 3 "$BASE/esp32sim-0.4.0-linux-x86_64.tar.gz" -o esp32sim-0.4.0-linux-x86_64.tar.gz
          curl -fL --retry 3 "$BASE/esp32sim-0.4.0-SHA256SUMS.txt" -o SHA256SUMS.txt
          grep 'esp32sim-0.4.0-linux-arm64.tar.gz' SHA256SUMS.txt > arm64.sum
          grep 'esp32sim-0.4.0-linux-x86_64.tar.gz' SHA256SUMS.txt > host.sum
          sha256sum -c arm64.sum
          sha256sum -c host.sum
          tar -xzf esp32sim-0.4.0-linux-arm64.tar.gz -C dist/arm64
          tar -xzf esp32sim-0.4.0-linux-x86_64.tar.gz -C dist/host
          find dist/arm64 -type f -name esp32sim -print -quit | grep -q .
          find dist/host -type f -name esp32sim -print -quit | grep -q .

      - name: Run host emulator smoke checks
        shell: bash
        run: |
          set -euo pipefail
          HOST_BIN="$(find dist/host -type f -name esp32sim -perm -u+x -print -quit)"
          "$HOST_BIN" --version
          # This CLI prints help to stderr and returns a non-zero status for --help.
          "$HOST_BIN" --help > dist/host/cli-help.txt 2>&1 || true
          grep -q -- '--chip' dist/host/cli-help.txt
          grep -q -- '--chip esp32' dist/host/cli-help.txt

      - name: Fetch verified Espressif classic ESP32 mask ROM
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find dist/arm64 -type f -name fetch-rom-elfs.sh -print -quit)"
          if [ -z "$TOOL" ]; then
            TOOL="$(find dist/host -type f -name fetch-rom-elfs.sh -print -quit)"
          fi
          test -n "$TOOL"
          bash "$TOOL" "$PWD/roms"
          test -f roms/esp32_rev300_rom.elf
          sha256sum roms/esp32_rev300_rom.elf > roms/SHA256SUMS

      - name: Assemble UserLAnd ARM64 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          ARM_BIN="$(find dist/arm64 -type f -name esp32sim -print -quit)"
          test -n "$ARM_BIN"
          # Upstream archive nests the executable in a versioned directory.
          # Normalize the package entry point while retaining the upstream tree.
          cp -a dist/arm64/. package/
          cp -a "$ARM_BIN" package/esp32sim
          cp -a roms package/roms
          cp SHA256SUMS.txt package/
          cat > package/README-JENEW.txt <<'EOF'
          JENEW ESP32Sim ARM64 package
          Upstream: https://github.com/mikroverk/esp32sim
          Version: 0.4.0
          Target: classic ESP32 / ESP32-WROOM-32 (Xtensa LX6)
          Run: ./esp32sim --chip esp32 --boot rom --help
          ROM: roms/esp32_rev300_rom.elf
          This is the Linux ARM64 simulator package, not an Android APK.
          Classic ESP32 support is early; verify each peripheral used by firmware.
          EOF
          chmod +x package/esp32sim
          test -x package/esp32sim
          test -s package/roms/esp32_rev300_rom.elf
          (cd package && zip -qr ../JENEW-ESP32SIM-USERLAND-ARM64.zip .)
          sha256sum JENEW-ESP32SIM-USERLAND-ARM64.zip > JENEW-ESP32SIM-USERLAND-ARM64.zip.sha256

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: JENEW-ESP32SIM-USERLAND-ARM64
          path: |
            JENEW-ESP32SIM-USERLAND-ARM64.zip
            JENEW-ESP32SIM-USERLAND-ARM64.zip.sha256
            package/
          if-no-files-found: error
          retention-days: 30
