name: JENEW zrok Go SDK Android AAR Prototype

on:
  workflow_dispatch:
    inputs:
      run_emulator_smoke:
        description: "Also run the optional Android emulator/JNI runtime smoke test"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - zrok-gomobile-prototype
    paths:
      - ".github/workflows/zrok-gomobile-aar.yml"
      - "zrok-mobile/**"
      - "android-smoke/**"
  pull_request:
    branches:
      - zrok-gomobile-prototype
    paths:
      - ".github/workflows/zrok-gomobile-aar.yml"
      - "zrok-mobile/**"
      - "android-smoke/**"

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: zrok-mobile/go.mod

      # Use the Android SDK already provisioned on GitHub's Ubuntu runner.
      # Avoid setup-android@v3: it attempts to install the retired "tools" package.
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install and initialize gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Run zrok bridge unit tests
        working-directory: zrok-mobile
        run: |
          set -euo pipefail
          go mod tidy
          go test ./...

      - name: Resolve zrok SDK and build Android AAR
        working-directory: zrok-mobile
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          go mod tidy
          go list -deps ./...
          mkdir -p ../output
          gomobile bind -v -target=android/arm64,android/amd64 -androidapi 23 -trimpath -ldflags="-s -w" -o ../output/jenew-zrok-sdk.aar ./bridge
          test -s ../output/jenew-zrok-sdk.aar
          unzip -l ../output/jenew-zrok-sdk.aar
          unzip -p ../output/jenew-zrok-sdk.aar AndroidManifest.xml >/dev/null

      - name: Set up Java for Android bridge compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle for Android bridge compilation
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile isolated Android app against generated AAR
        run: |
          set -euo pipefail
          mkdir -p android-smoke/app/libs
          cp output/jenew-zrok-sdk.aar android-smoke/app/libs/
          gradle -p android-smoke --no-daemon assembleDebug
          test -s android-smoke/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload prototype AAR
        uses: actions/upload-artifact@v4
        with:
          name: JENEW-ZROK-GOMOBILE-AAR-PROTOTYPE
          path: output/jenew-zrok-sdk.aar
          if-no-files-found: error
          retention-days: 14

  # Runtime testing is deliberately opt-in: ADB/emulator availability must not
  # block the primary Go SDK + Android AAR build.
  emulator-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator_smoke }}
    needs: build-aar
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated smoke-test app
        uses: actions/checkout@v4

      - name: Download freshly built zrok AAR
        uses: actions/download-artifact@v4
        with:
          name: JENEW-ZROK-GOMOBILE-AAR-PROTOTYPE
          path: android-smoke/app/libs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build isolated Android smoke-test APK
        run: |
          set -euo pipefail
          test -s android-smoke/app/libs/jenew-zrok-sdk.aar
          gradle -p android-smoke --no-daemon assembleDebug

      - name: Boot Android 15 emulator and test Go/JNI bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash android-smoke/run-emulator-smoke.sh

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JENEW-ZROK-ANDROID-EMULATOR-LOGS
          path: |
            android-smoke/zrok-smoke.log
            android-smoke/logcat-full.txt
          if-no-files-found: ignore
          retention-days: 14
