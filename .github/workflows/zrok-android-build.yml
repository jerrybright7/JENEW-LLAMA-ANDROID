name: JENEW ZROK Android build

on:
  push:
    branches:
      - main
      - zrok-gomobile-prototype
      - zrok-repair-final2-2026-11-10
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - zrok-gomobile-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aar-and-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: zrok-mobile/go.sum
      - name: Install Android platform and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Test Go bridge
        working-directory: zrok-mobile
        env:
          CGO_ENABLED: '1'
        run: |
          go mod download
          go test ./...
      - name: Install and initialize gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Build Android AAR
        working-directory: zrok-mobile
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p ../android-smoke/app/libs
          gomobile bind -v -target=android -androidapi 23 -o ../android-smoke/app/libs/jenew-zrok-sdk.aar ./bridge
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        run: gradle -p android-smoke :app:assembleDebug --no-daemon
      - name: Upload AAR and APK
        uses: actions/upload-artifact@v4
        with:
          name: jenew-zrok-aar-and-apk
          if-no-files-found: error
          path: |
            android-smoke/app/libs/jenew-zrok-sdk.aar
            android-smoke/app/build/outputs/apk/debug/app-debug.apk
