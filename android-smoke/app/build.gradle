plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jenew.zroksmoke'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jenew.zroksmoke'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0-smoke'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/jenew-zrok-sdk.aar')
}
